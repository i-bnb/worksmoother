name = "doctorcare"
main = "apps/web/.open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/.open-next/assets"
binding = "ASSETS"

# Service Binding to internal API Worker
[[services]]
binding = "API_SERVICE"
service = "doctorcare-api"

[vars]
NEXT_PUBLIC_APP_NAME = "DoctorCare"
NEXT_PUBLIC_API_URL = "https://doctorcare-api.syam18official.workers.dev"
