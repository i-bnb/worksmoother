name = "doctorcare-api"
main = "src/index.ts"
compatibility_date = "2024-09-18"
compatibility_flags = ["nodejs_compat"]

# Point api.yourhospital.com to a Cloudflare Pro zone to enable Managed WAF and OWASP Core rulesets
routes = [
  { pattern = "api.yourhospital.com", custom_domain = true }
]

# Service Bindings to internal Workers
[[services]]
binding = "RECORDS_SERVICE"
service = "doctorcare-records"

[[services]]
binding = "NOTIFY_SERVICE"
service = "doctorcare-notify"

# Operational Data (Appwrite Cloud Project A) Environment Variables
[vars]
ENVIRONMENT = "production"
APPWRITE_ENDPOINT = "https://cloud.appwrite.io/v1"
APPWRITE_PROJECT_A_ID = "doctorcare-operational-prod"

# Note: APPWRITE_PROJECT_A_KEY is managed via `wrangler secret put APPWRITE_PROJECT_A_KEY`
# to ensure credentials are never committed in plaintext.

# Durable Objects: SESSION_DO (user ID), SLOT_DO (doctor-day sharded), and RATE_LIMITER_DO (exact sliding window)
[durable_objects]
bindings = [
  { name = "SESSION_DO", class_name = "SessionDurableObject" },
  { name = "SLOT_DO", class_name = "SlotDurableObject" },
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["SessionDurableObject"]

[[migrations]]
tag = "v2"
new_classes = ["SlotDurableObject"]

[[migrations]]
tag = "v3"
new_classes = ["RateLimiterDurableObject"]

# Cloudflare Queue Producer for asynchronous tasks
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "doctorcare-tasks"

# Layer 2: Cloudflare Workers RateLimit Bindings
[[ratelimits]]
binding = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
binding = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 15, period = 60 }




