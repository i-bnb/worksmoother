name = "doctorcare-api"
main = "src/index.ts"
compatibility_date = "2024-09-18"
compatibility_flags = ["nodejs_compat"]

# Point your custom domain to a Cloudflare zone once configured:
# routes = [
#   { pattern = "api.yourhospital.com", custom_domain = true }
# ]

# Service Bindings to internal Workers
[[services]]
binding = "RECORDS_SERVICE"
service = "doctorcare-records"

[[services]]
binding = "NOTIFY_SERVICE"
service = "doctorcare-notify"

# Cloudflare D1 Operational Database (Identity, Clinical Directory, Slots, Bookings)
[[d1_databases]]
binding = "DB"
database_name = "doctorcare-ops-db"
database_id = "2dc1309c-f9b5-4613-bbbb-5a9eac3a004e"

[vars]
ENVIRONMENT = "production"


# Durable Objects: SESSION_DO (user ID), SLOT_DO (doctor-day sharded), and RATE_LIMITER_DO (exact sliding window)
[durable_objects]
bindings = [
  { name = "SESSION_DO", class_name = "SessionDurableObject" },
  { name = "SLOT_DO", class_name = "SlotDurableObject" },
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SlotDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimiterDurableObject"]

# Cloudflare Queue Producer for asynchronous tasks
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "doctorcare-tasks"

# Layer 2: Cloudflare Workers RateLimit Bindings
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 15, period = 60 }




